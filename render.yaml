# Blueprint Render — InteriMatch
# Postgres free ≈ 30 jours | Web free s'endort après ~15 min

databases:
  - name: interimatch-db
    plan: free
    databaseName: interimatch
    user: interimatch

services:
  - type: web
    name: interimatch
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: interimatch-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: MONGO_URL
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
